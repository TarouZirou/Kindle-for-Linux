[package]
name = "kindle-for-linux"
version = "0.2.0"
edition = "2021"
description = "Ultra-light e-book / comic reader for Linux with a verified (Lean 4) core"
license = "MIT"
repository = "https://github.com/TarouZirou/Kindle-for-Linux"
rust-version = "1.80"

[dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
ab_glyph = "0.2"
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
